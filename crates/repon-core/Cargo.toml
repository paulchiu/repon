[package]
name = "repon-core"
description = "Rendering-agnostic core for Repon: computes git state, knows nothing about terminals"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

# docs.rs builds five targets by default and two of them are Windows, where this
# crate does not compile at all.
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]

# Off by default: gates test-only affordances that would otherwise ship on the
# published surface forever, per ADR 0021. `repon` enables it through
# `[dev-dependencies]` only, so its own tests keep working without reaching the
# feature from its production build.
[features]
test-util = []
# Off by default, per ADR 0015: derives `Serialize` on this crate's own public types for the
# settled document `repon status` prints, rather than a consumer-side wire struct. Also turns
# on gix's own `serde` feature (needed for `gix::ObjectId` on a settled `Head`) and serde's
# `rc` feature, without which `Arc<str>` does not implement `Serialize` at all.
serde = ["dep:serde", "gix/serde"]
# Off by default, per ADR 0015: the one mutating path in this crate, isolated so a
# consumer that never turns it on pulls in none of gix's blocking network client,
# HTTP transport (reqwest, rustls and their own dependency trees) or credential
# machinery. These resolve inside gix's own already-allowed subtree, so the direct-dependency
# check cannot see them either way; `check-core-isolation`'s `check_network_stack_is_gated`
# reads the whole transitive tree instead, and is what proves they are absent by default.
fetch = [
    "gix/blocking-network-client",
    "gix/blocking-http-transport-reqwest-rust-tls",
    "gix/credentials",
]

[dependencies]
crossbeam-channel.workspace = true
# Matched against a Set's roots case-sensitively, per docs/spec/config.md; discovery's
# boundary walk is the sole consumer.
globset = "0.4.20"
# Read-only surface by choice on the probe path: these defaults pull in none of gix's
# mutation, merge, blame, archive or credentials machinery. The `fetch` feature below is
# the one deliberate exception (ADR 0015's "The read-only invariant is scoped to the
# probe path"), adding blocking network and transport features of its own.
gix = { version = "0.87.1", default-features = false, features = [
    "max-performance-safe",
    "sha1",
    "basic",
    "status",
    "dirwalk",
] }
# setsid(2) and openpty(3) for an Action step's PTY-backed child (ADR 0018), already in the
# dependency tree transitively via backtrace, color-eyre, cpufeatures and sha1, so this only
# makes a direct dependency of a crate that already resolved it explicit.
libc = "0.2.189"
rayon = "1.12.0"
# The settled document's wire format on stdout (ADR 0015), behind the `serde` feature above
# and off by default: `repon` is the one consumer that turns it on.
serde = { version = "1.0.229", optional = true, features = ["derive", "rc"] }

[dev-dependencies]
# This crate on itself, purely to turn `test-util` on for its own test targets. An
# integration test under `tests/` links against the library built *without* `cfg(test)`,
# so `liveness` and `Core::settle` are invisible to it unless something in the graph asks
# for the feature. `repon`'s own dev-dependency already did that for `cargo test
# --workspace`, and only for that: `cargo test -p repon-core`, which `just test` runs on
# its own for the `fetch` feature, resolves without `repon` and saw neither. Stripped on
# publish, like every path-only dev-dependency.
repon-core = { path = ".", features = ["test-util"] }
tempfile = "3.27.0"
