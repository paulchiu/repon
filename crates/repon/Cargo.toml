[package]
name = "repon"
description = "A terminal UI for the outer loop: seeing many git repos at once and acting on many in one gesture"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
color-eyre = "0.6.5"
crossbeam-channel.workspace = true
crossterm = { version = "0.29.0", features = ["serde"] }
directories = "6.0.0"
etcetera = "0.11.0"
globset = "0.4.20"
humantime-serde = "1.1.1"
ratatui = "0.30"
repon-core.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_ignored = "0.1.14"
signal-hook = "0.4.4"
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
# Enables `Timestamp::at` for this crate's own tests without reaching it from the
# `[dependencies]` entry above, which is what keeps a production build of `repon`
# from carrying it.
repon-core = { workspace = true, features = ["test-util"] }
tempfile = "3.27.0"
# The width function ratatui itself budgets glyphs with; the width test in `glyphs.rs`
# measures against this, not against ratatui's own re-export, so the version is pinned here.
unicode-width = "0.2.2"
