[package]
name = "repon"
description = "A terminal UI for the outer loop: seeing many git repos at once and acting on many in one gesture"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]

# Off by default, forwarding to `repon-core/fetch` (see that feature's own comment): this is
# the one knob that reaches it from a binary a user can actually install. `cargo install`
# has no `--features repon-core/fetch` of its own to type, since a workspace path dependency
# is invisible to it; `--features fetch` on this crate is the only way in
# (`docs/spec/releasing.md`'s "Where Repon can be installed from").
[features]
fetch = ["repon-core/fetch"]

[dependencies]
# Parses a captured Action step's raw ANSI SGR bytes into ratatui spans at render time
# (`docs/spec/actions.md`'s "The run on screen"): ratatui-core itself drops every control
# character rather than interpreting it, so an escape sequence fed straight into a `Span`
# renders as literal digits and brackets. Chosen over hand-rolling a parser because the
# subset needed (SGR colour and style codes, indexed and truecolor included) is exactly
# this crate's own surface, is already used and verified against this project's own
# ratatui version (ADR 0018), and its own dependency tree (nom, ratatui-core, simdutf8,
# smallvec, thiserror) adds nothing this crate does not already need or a smaller
# hand-rolled parser would not eventually grow into. Pinned exactly, matching this crate's
# stated preference for a deliberate upgrade over a silent one.
ansi-to-tui = "=8.0.1"
clap = { version = "4.6.6", features = ["derive"] }
color-eyre = "0.6.5"
crossbeam-channel.workspace = true
crossterm = { version = "0.29.0", features = ["serde"] }
directories = "6.0.0"
etcetera = "0.11.0"
globset = "0.4.20"
humantime-serde = "1.1.1"
# dup(2)/dup2(2) for redirecting fd 2 to the log file while the alternate screen is held
# (`tui.rs`'s `redirect_stderr_to_log`), already in the dependency tree transitively via
# backtrace/color-eyre and cpufeatures/sha1, and already a direct dependency of `repon-core`
# for the same reason (its own `Cargo.toml` comment on this line).
libc = "0.2.189"
ratatui = "0.30"
# `delete`'s phase 2, a bounded worker pool draining the ignored directories phase 1 found
# independently of one another: already a direct dependency of `repon-core` for the probe
# fan-out, pinned to the same version here since the two never need to agree beyond that.
rayon = "1.12.0"
# `serde` turns on the settled document's wire format (ADR 0015): `repon status` is the
# one caller that needs it. `repon-core`'s own `fetch` feature is deliberately never
# requested by default here: it gates the periodic fetch's blocking network client, HTTP
# transport and credential machinery, and turning it on for this binary's default build put
# reqwest, rustls and aws-lc-sys in every ordinary `cargo build`, breaking the Windows
# cross-compile guard and the point of the feature existing at all. The `[features]` block
# above forwards it as this crate's own opt-in `fetch` feature instead, so it stays reachable
# from an install without ever joining `default`. `CoreSpec::fetch` stays plain,
# always-present bounding data either way (`FetchSpec`'s own doc comment), so this crate's
# own code needs no `cfg` for it; without the cargo feature the periodic fetch simply never
# runs, whatever a user's `config.toml` says.
repon-core = { workspace = true, features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_ignored = "0.1.14"
# Encodes the settled document `repon status` prints: repon-core only derives `Serialize` on
# its own types (per ADR 0015's "no separate consumer-side wire structs"), so this crate picks
# the actual wire encoding.
serde_json = "1.0.145"
# Splits a Launcher's `from_env` value, and the editor chain's, into argv with no shell
# involved; already in the dependency tree transitively via gix-command, per ADR 0018.
shell-words = "1.1.1"
signal-hook = "0.4.4"
# The ad hoc-editor handoff's scratch file: a real dependency here, not only a dev one, since
# `editor::edit` writes and rereads one in production.
tempfile = "3.27.0"
toml = "1.1.4"
# The read-modify-write of `config.toml` behind the `[[repo]]` entries Repon owns
# (ADR 0028): `toml` above deserialises into this crate's own structs and cannot round-trip a
# hand-edited document without dropping every comment, which is the file's whole value under
# ADR 0014. Kept alongside `toml` rather than replacing it, since the schema, the four failure
# grades and the unknown-key warning are all built on serde deserialisation this does not do.
# It shares `indexmap`, `serde_spanned`, `toml_datetime`, `toml_parser`, `toml_writer` and
# `winnow` with the `toml` already here, so it adds one package to the lockfile. Not a core
# dependency: nothing in `repon-core` reads or writes a file, so `check-core-isolation`'s
# allowlist is untouched.
toml_edit = "0.25.13"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# Splits a captured Action step's own output into grapheme clusters directly, bypassing
# `ratatui_core::text::Span::styled_graphemes`'s own control-character filter: that filter
# drops a raw tab before this crate ever sees it (`span.rs`'s
# `.filter(|g| !g.contains(char::is_control))`), which is exactly the byte tab-stop
# expansion needs to see. Already in the dependency tree transitively via ratatui and
# ansi-to-tui, so this only makes a direct dependency of one already resolved.
unicode-segmentation = "1.13.3"

[dev-dependencies]
# Enables `Timestamp::at` for this crate's own tests without reaching it from the
# `[dependencies]` entry above, which is what keeps a production build of `repon`
# from carrying it.
repon-core = { workspace = true, features = ["test-util"] }
# The width function ratatui itself budgets glyphs with, hence the version pinned exactly:
# `glyphs.rs`'s own width test measures every glyph against it. No longer a normal
# dependency now that the Action and Launcher palettes read their query caret back from
# their own paint instead of measuring the typed query's display width separately
# (`crate::filter_line::FilterLine::draw`'s technique). Already in the dependency tree
# transitively via ratatui either way, so this only drops a direct dependency of one still
# resolved.
unicode-width = "0.2.2"
