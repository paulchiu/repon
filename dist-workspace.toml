[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
#
# The two platforms docs/spec/releasing.md claims support for. macOS ships one
# archive per architecture rather than a universal binary, because Homebrew
# picks the archive matching the machine it installs on.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Where to host releases
hosting = "github"
# The crates.io leg is a custom job rather than one of dist's own, because dist
# does not publish to registries; see .github/workflows/publish-crates.yml.
publish-jobs = ["homebrew", "./publish-crates"]
tap = "paulchiu/homebrew-tap"
formula = "repon"

# Keep the generated workflow on the same checkout major as the hand-written
# ones; dist 0.32.0 still emits v5 on its own
[dist.github-action-commits]
"actions/checkout" = "v5"
