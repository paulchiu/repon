[workspace]

[package]
name = "fanout-sweep"
version = "0.1.0"
edition = "2024"
publish = false
description = "Corpus generator and sweep driver for the probe fan-out width, kept outside the main workspace so it never reaches `just ci`'s build or lint passes."

# Same gix version and feature set as repon-core's own [dependencies], so the status call
# this tool times is the identical call gix compiles for production, not a lookalike
# against a different release.
[dependencies]
gix = { version = "0.87.1", default-features = false, features = [
    "max-performance-safe",
    "sha1",
    "basic",
    "status",
    "dirwalk",
] }
# `getrusage(2)` for the peak-RSS column the `landing` sweep reports: an object cache is a
# time-against-memory trade, so a run that prints only wall clock cannot support the
# decision. Same version repon-core pins.
libc = "0.2.189"
rayon = "1.12.0"
