name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality-check:
    name: Format, Lint, Test & Build
    # Repon is a Unix program: Actions put each step in a new session with
    # setsid(2) and read it back over a PTY. The Windows leg is the
    # windows-target-guard job below, which proves the guard fires rather than
    # testing a platform Repon ships. Both Unix runners are free on a public
    # repository.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      # The justfile owns what CI means: format, lint, test, docs, core isolation
      # and build. Duplicating the steps here would let the two drift apart.
      - name: Format, Lint, Test & Build
        run: just ci

  windows-target-guard:
    name: Windows guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      # cargo check never reaches the linker, so the compile_error! guard fires
      # on ubuntu-latest without a Windows runner. The job fails unless the
      # build fails, and fails with the guard's own message.
      - name: Prove the Unix guard fires on a Windows target
        run: |
          set +e
          output=$(cargo check --workspace --target x86_64-pc-windows-msvc --locked 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo "expected cargo check to fail on the Windows target, but it succeeded" >&2
            exit 1
          fi
          if ! grep -q "repon-core requires a Unix target" <<< "$output"; then
            echo "build failed, but not with the compile_error! guard's message" >&2
            exit 1
          fi

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      # The recipe reads the floor out of the manifest, so the version Cargo
      # promises and the version this job proves cannot drift apart.
      - name: Build and test against the declared floor
        run: just msrv

  publish-check:
    name: Publish rehearsal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      # Nothing is published until beta, but the command that will publish is
      # rehearsed on every change, so the first real release is not the first
      # time it runs.
      - name: Package and verify both crates
        run: just publish-check

  # One required status check, so branch protection needs no editing when a job
  # is added above.
  ci:
    name: CI
    if: always()
    needs: [quality-check, windows-target-guard, msrv, publish-check]
    runs-on: ubuntu-latest
    steps:
      - run: jq --exit-status 'all(.result == "success")' <<< '${{ toJson(needs) }}'
