# The version label is what decides whether a merge cuts a release and by how
# much, so a PR that carries none, or carries two, has to fail before it can be
# merged rather than after. See version-tag.yml for what the label then does.

name: Check Version Labels

on:
  pull_request:
    types: [opened, labeled, unlabeled, synchronize, reopened]

jobs:
  check-labels:
    name: Enforce Semantic Versioning
    runs-on: ubuntu-latest
    steps:
      - name: Check for version labels
        uses: actions/github-script@v9
        with:
          script: |
            const labels = context.payload.pull_request.labels.map(l => l.name);
            const versionLabels = ['major', 'minor', 'patch', 'norelease'];
            const present = labels.filter(l => versionLabels.includes(l));

            if (present.length === 0) {
              core.setFailed('PR must have exactly one of: ' + versionLabels.join(', '));
            }

            if (present.length > 1) {
              core.setFailed('PR must have EXACTLY one version label, found: ' + present.join(', '));
            }
