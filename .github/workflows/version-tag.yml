# Versioning and tagging only. Pushing the tag is where this workflow stops:
# release.yml, which dist generates and owns, triggers on that tag and builds,
# uploads and publishes everything from there.
#
# This replaces the hand-run `cargo set-version` on main that AGENTS.md's dev
# loop used to ask for. The version moved on every merge that way while a tag
# was cut only when someone remembered, which is the gap 0021 is about.

name: Version Tag

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: github.event.pull_request.merged == true
    # Version bumping only rewrites manifests and the lockfile, so this needs
    # neither of the two OS legs quality-check runs on.
    runs-on: ubuntu-latest
    steps:
      - name: Determine version bump
        id: bump
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const labels = context.payload.pull_request.labels.map(l => l.name);
            return ['major', 'minor', 'patch'].find(l => labels.includes(l)) ?? '';

      - name: Checkout code
        if: steps.bump.outputs.result != ''
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          # A tag pushed with the default GITHUB_TOKEN starts no further
          # workflows, so release.yml would never see it. RELEASE_TOKEN is a PAT
          # that can push to this repository; without it the bump and the tag
          # still land and the release has to be started by hand.
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Rust
        if: steps.bump.outputs.result != ''
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-edit
        if: steps.bump.outputs.result != ''
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-edit

      - name: Configure git
        if: steps.bump.outputs.result != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump the version and tag it
        if: steps.bump.outputs.result != ''
        run: |
          # One command moves both crates and the pinned repon-core dependency
          # version together, so the three can never drift out of lockstep.
          cargo set-version --workspace --bump "${{ steps.bump.outputs.result }}"
          cargo update -w

          NEW_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')

          git add Cargo.toml Cargo.lock crates/repon/Cargo.toml crates/repon-core/Cargo.toml
          git commit -m "chore(release): bump version to $NEW_VERSION"
          git tag "v$NEW_VERSION"

          git push origin main
          git push origin "v$NEW_VERSION"
