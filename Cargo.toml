[workspace]
resolver = "3"
members = ["crates/repon", "crates/repon-core"]

[workspace.package]
version = "0.29.0"
edition = "2024"
# The floor twelve lockfile packages already set, and the number `cargo update`
# resolves against: undeclared, it resolves against whatever toolchain is installed.
rust-version = "1.88"
license = "MIT"
authors = ["Paul Chiu"]
repository = "https://github.com/paulchiu/repon"
homepage = "https://github.com/paulchiu/repon"
# Resolved from the workspace root, so both crates ship the one README.
readme = "README.md"
keywords = ["git", "tui", "worktree", "monorepo", "terminal"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
crossbeam-channel = "0.5.16"
# The version is what makes the workspace publishable at all, and `cargo
# set-version --workspace` rewrites it with the rest on a bump.
repon-core = { path = "crates/repon-core", version = "0.29.0" }

# Read the optimization guideline for more details:
# https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# The profile that dist builds with, on top of the release profile above.
[profile.dist]
inherits = "release"
lto = "thin"
